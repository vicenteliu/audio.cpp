[package]
name = "audiocpp-deploy"
version = "0.1.0"
edition = "2021"
description = "audio.cpp 自动安装部署工具 (私有, fork-only)"

[[bin]]
name = "acpd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"

[profile.release]
strip = true
lto = "thin"
